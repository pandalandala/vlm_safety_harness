# E1/E2/E5 main experiment: Qwen3.5-9B + DREAMS SFT.

name: main_dreams_qwen3_5
description: "Qwen3.5-9B fine-tuned on DREAMS dataset with structured CoT"
tags: [main, qwen3_5, dreams, full-sft, tier_a]
group: main

_extends: base/model_qwen3_5_9b.yaml

model:
  name: qwen3_5_9b
  hf_path: Qwen/Qwen3.5-9B
  architecture: qwen3_vl
  size_b: 9.0
  trust_remote_code: true
  max_model_len: 8192
  min_pixels: 200704
  max_pixels: 1003520

dataset:
  name: dreams_main_qwen3_5
  train_path: /mnt/hdd/xuran/vlm_safety_harness/data_links/our_dataset/train.json
  test_path: /mnt/hdd/xuran/vlm_safety_harness/data_links/our_dataset/test.json
  image_root: /mnt/hdd/xuran/vlm_safety_harness/data_links/our_dataset
  cf_pairs_path: /mnt/hdd/xuran/mis_dataset_builder/dataset/test_cf.json

training:
  enabled: true
  backend: llamafactory
  finetuning_type: full
  max_gpus: 8
  use_cot_labels: true
  cot_format: structured
  freeze_vision_tower: true
  freeze_multi_modal_projector: false
  learning_rate: 1.0e-5
  num_train_epochs: 3.0
  lr_scheduler_type: cosine
  warmup_ratio: 0.1
  bf16: true
  cutoff_len: 4096
  save_strategy: "no"
  save_steps: 500
  logging_steps: 10

inference:
  backend: lf_vllm
  benchmarks: [our_test]
  batch_size: 32
  temperature: 0.0
  max_tokens: 1024
  concurrency: 16

evaluation:
  model: gpt-4o
  api_key_env: OPENAI_API_KEY
  max_concurrent_requests: 20
  max_tokens: 128
  temperature: 0.0
  compute_per_category: true
  output_format: [json, latex]

tracking:
  backend: none
  project: dreams_vlm_safety
