# E1/E2/E3 main experiment: InternVL3.5-8B + DREAMS SFT
# Full SFT with structured CoT labels.
#
# Canonical checkpoint: /mnt/hdd/xuran/vlm_safety_harness/models/dreams_internvl3_5/
# 78server: --skip-train --model-path /mnt/hdd/xuran/vlm_safety_harness/models/dreams_internvl3_5

name: main_dreams_internvl3_5
description: "InternVL3.5-8B fine-tuned on DREAMS dataset with structured CoT"
tags: [main, internvl3_5, dreams, full-sft, tier_a]
group: main

_extends: base/model_internvl3_5_8b.yaml

model:
  name: internvl3_5_8b
  hf_path: OpenGVLab/InternVL3_5-8B-HF
  architecture: internvl
  size_b: 8.0
  trust_remote_code: true
  max_model_len: 8192
  max_dynamic_patch: 4

dataset:
  name: dreams_main_internvl3_5
  train_path: /mnt/hdd/xuran/vlm_safety_harness/data_links/our_dataset/train.json
  test_path: /mnt/hdd/xuran/vlm_safety_harness/data_links/our_dataset/test.json
  image_root: /mnt/hdd/xuran/vlm_safety_harness/data_links/our_dataset
  max_train_samples: null
  max_test_samples: null
  cf_pairs_path: /mnt/hdd/xuran/vlm_safety_harness/data_links/our_dataset/test_cf.json

training:
  enabled: true
  backend: llamafactory
  finetuning_type: full
  max_gpus: 8
  use_cot_labels: true
  cot_format: structured
  freeze_vision_tower: true
  freeze_multi_modal_projector: false
  learning_rate: 1.0e-5
  num_train_epochs: 3.0
  lr_scheduler_type: cosine
  warmup_ratio: 0.1
  bf16: true
  cutoff_len: 2048
  save_strategy: steps
  save_steps: 100
  save_total_limit: 1
  logging_steps: 10

inference:
  backend: lf_vllm
  benchmarks:
    - our_test
  batch_size: 32
  temperature: 0.0
  max_tokens: 1024
  concurrency: 16

evaluation:
  model: gpt-4o
  api_key_env: OPENAI_API_KEY
  max_concurrent_requests: 20
  max_tokens: 128
  temperature: 0.0
  compute_per_category: true
  output_format: [json, latex]

tracking:
  backend: none
  project: dreams_vlm_safety
