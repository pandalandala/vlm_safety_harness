# Template for Tier B inference-only baselines.
# Concrete YAMLs are generated by scripts/generate_baseline_configs.py from
# _tier_b_models.csv. Do NOT consume this file directly with ConfigLoader —
# it has placeholders that must be substituted.

name: main_baseline_deepseek_vl2_tiny
description: "DeepSeek-VL2-Tiny (Tier B — inference only"
tags: [main, tier_b, inference-only]
group: main

model:
  name: deepseek_vl2_tiny
  hf_path: deepseek-ai/deepseek-vl2-tiny
  architecture: deepseek_vl2
  size_b: 3.0
  trust_remote_code: true
  max_model_len: 4096

dataset:
  name: tier_b_eval_deepseek_vl2_tiny
  test_path: /mnt/hdd/xuran/vlm_safety_harness/data_links/our_dataset/test.json
  image_root: /mnt/hdd/xuran/vlm_safety_harness/data_links/our_dataset
  cf_pairs_path: /mnt/hdd/xuran/vlm_safety_harness/data_links/our_dataset/test_cf.json

training:
  enabled: false

inference:
  backend: lf_vllm
  benchmarks: [our_test]
  batch_size: 32
  temperature: 0.0
  max_tokens: 1024
  concurrency: 16

evaluation:
  model: gpt-4o
  api_key_env: OPENAI_API_KEY
  max_concurrent_requests: 20
  max_tokens: 128
  temperature: 0.0
  compute_per_category: true
  output_format: [json, latex]

tracking:
  backend: none
  project: dreams_vlm_safety
