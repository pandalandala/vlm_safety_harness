# A3: Synthetic-Real Distribution Gap (P4)
# Hypothesis: MIRage trained on SD-generated images cannot generalize to real images.
# Method: Directly compare ASR across MIS easy (synth) / hard (synth) / real (web).
# Data: MIS test sets only — no DREAMS data.
# Models: InternVL2.5-8B (base) + MIRage.

name: A3_synthetic_real_gap
description: "Diagnose synthetic-to-real generalization gap in MIRage"
tags: [prelim, A-experiment, synthetic-real-gap]
group: prelim

model:
  name: internvl2_5_8b
  hf_path: OpenGVLab/InternVL2_5-8B
  architecture: internvl
  size_b: 8.0
  trust_remote_code: true
  max_model_len: 8192
  max_dynamic_patch: 4

dataset:
  name: mis_all_subsets
  test_path: /mnt/hdd/xuran/vlm_safety_harness/data_links/mis_test/mis_easy.json
  image_root: /mnt/hdd/xuran/vlm_safety_harness/data_links/mis_test
  max_test_samples: null

training:
  enabled: false

inference:
  backend: vllm
  benchmarks:
    - mis_easy    # AI-generated (1675 samples)
    - mis_hard    # AI-generated (510 samples)
    - mis_real    # Web-retrieved (100 samples) — key comparison point
  batch_size: 32
  temperature: 0.0
  max_tokens: 1024

evaluation:
  model: gpt-4o
  api_key_env: OPENAI_API_KEY
  max_concurrent_requests: 20
  max_tokens: 128
  temperature: 0.0
  compute_per_category: true

tracking:
  backend: none
